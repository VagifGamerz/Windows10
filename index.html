<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 10 Web Simulation</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            overflow: hidden;
        }

        /* Desktop Icons */
        .desktop {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px;
        }

        .icon {
            width: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            cursor: pointer;
            padding: 5px;
            border-radius: 5px;
        }

        .icon:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .icon span {
            font-size: 32px;
        }

        .icon p {
            font-size: 12px;
            margin-top: 5px;
            text-align: center;
        }

        /* Taskbar */
        .taskbar {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 40px;
            background: rgba(16, 16, 16, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .taskbar-left {
            display: flex;
            height: 100%;
        }

        .start-btn {
            width: 48px;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .start-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .clock {
            color: white;
            font-size: 12px;
            padding-right: 15px;
            text-align: right;
        }

        /* Start Menu */
        .start-menu {
            position: absolute;
            bottom: 40px;
            left: 0;
            width: 250px;
            background: rgba(31, 31, 31, 0.95);
            backdrop-filter: blur(10px);
            display: none;
            flex-direction: column;
            padding: 10px;
            border-top-right-radius: 5px;
            z-index: 999;
        }

        .start-item {
            color: white;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            border-radius: 3px;
        }

        .start-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Windows Window */
        .window {
            position: absolute;
            top: 100px;
            left: 150px;
            width: 450px;
            height: 300px;
            background: #ffffff;
            border-radius: 5px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 100;
        }

        .window-header {
            background: #f1f1f1;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move;
            border-bottom: 1px solid #ccc;
        }

        .close-btn {
            background: red;
            color: white;
            border: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
        }

        .window-content {
            padding: 15px;
            flex: 1;
        }

        textarea {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            resize: none;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <!-- Desktop -->
    <div class="desktop">
        <div class="icon" onclick="openWindow('notepad')">
            <span>📝</span>
            <p>Notepad</p>
        </div>
        <div class="icon" onclick="alert('This PC: C Drive - 250 GB Free')">
            <span>💻</span>
            <p>This PC</p>
        </div>
    </div>

    <!-- Start Menu -->
    <div class="start-menu" id="startMenu">
        <div class="start-item" onclick="openWindow('notepad')">📝 Notepad</div>
        <div class="start-item" onclick="alert('Windows 10 v22H2 Web Edition')">⚙️ Settings</div>
    </div>

    <!-- Notepad Window -->
    <div class="window" id="notepadWindow">
        <div class="window-header">
            <span>📝 Notepad</span>
            <button class="close-btn" onclick="closeWindow('notepad')">×</button>
        </div>
        <div class="window-content">
            <textarea placeholder="Bura istədiyin qeydi yaza bilərsən..."></textarea>
        </div>
    </div>

    <!-- Taskbar -->
    <div class="taskbar">
        <div class="taskbar-left">
            <div class="start-btn" onclick="toggleStart()">❖</div>
        </div>
        <div class="clock" id="clock">00:00</div>
    </div>

    <script>
        // Saat Funksiyası
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').innerText = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Start Menyusu Açılsın/Bağlansın
        function toggleStart() {
            const menu = document.getElementById('startMenu');
            menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
        }

        // Pəncərələri Açmaq
        function openWindow(name) {
            if(name === 'notepad') {
                document.getElementById('notepadWindow').style.display = 'flex';
            }
            document.getElementById('startMenu').style.display = 'none';
        }

        // Pəncərələri Bağlamaq
        function closeWindow(name) {
            if(name === 'notepad') {
                document.getElementById('notepadWindow').style.display = 'none';
            }
        }
    </script>
</body>
</html>
