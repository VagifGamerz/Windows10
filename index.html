<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Bedrock Edition v26.32</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Minecraft', 'Segoe UI', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* Fullscreen Game Container */
        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* Main Menu Overlay */
        #main-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), 
                        url('https://images.unsplash.com/photo-1627856013091-fed6e4e30025?q=80&w=1200') no-repeat center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .title {
            font-size: 48px;
            color: #fff;
            text-shadow: 3px 3px #000;
            margin-bottom: 5px;
        }

        .version {
            color: #FFFF55;
            font-size: 18px;
            text-shadow: 2px 2px #000;
            margin-bottom: 30px;
        }

        .menu-btn {
            width: 280px;
            padding: 12px;
            margin: 6px;
            background: #737373;
            border: 2px solid #000;
            color: white;
            font-size: 16px;
            cursor: pointer;
            text-align: center;
            box-shadow: inset -2px -2px #373737, inset 2px 2px #FFF;
        }

        .menu-btn:hover {
            background: #8B8B8B;
        }

        /* HUD & UI Elements */
        #hud {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .bars-container {
            display: flex;
            justify-content: space-between;
            width: 360px;
            margin-bottom: 5px;
        }

        .bar-group {
            display: flex;
            gap: 2px;
        }

        .heart, .food {
            font-size: 16px;
        }

        /* Hotbar */
        .hotbar {
            display: flex;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #3c3c3c;
            padding: 3px;
            gap: 3px;
        }

        .slot {
            width: 40px;
            height: 40px;
            background: #8b8b8b;
            border: 2px solid #373737;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            cursor: pointer;
        }

        .slot.active {
            border: 2px solid #fff;
            background: #a0a0a0;
        }

        /* Crosshair */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            display: none;
            z-index: 10;
            pointer-events: none;
        }
    </style>
    <!-- Three.js 3D Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="game-container">
    <!-- Crosshair -->
    <div id="crosshair">+</div>

    <!-- Main Menu -->
    <div id="main-menu">
        <h1 class="title">MINECRAFT</h1>
        <div class="version">Bedrock Edition v26.32</div>
        
        <button class="menu-btn" id="btn-play" onclick="startGame()">Dünyanı Yarat / Oyna</button>
        <button class="menu-btn" id="btn-lang" onclick="changeLanguage()">Dil: Azərbaycan</button>
        <button class="menu-btn" id="btn-full" onclick="toggleFullScreen()">Tam Ekran (Full Screen)</button>
    </div>

    <!-- Game HUD (Can, Yemək və Əşya Barı) -->
    <div id="hud">
        <div class="bars-container">
            <!-- Can Barı -->
            <div class="bar-group" id="health-bar">
                ❤️❤️❤️❤️❤️❤️❤️❤️❤️
            </div>
            <!-- Yemək Barı -->
            <div class="bar-group" id="food-bar">
                🍗🍗🍗🍗🍗🍗🍗🍗🍗🍗
            </div>
        </div>

        <!-- 9 Slotlu Hotbar -->
        <div class="hotbar">
            <div class="slot active" onclick="selectSlot(this)">🌱</div>
            <div class="slot" onclick="selectSlot(this)">🪨</div>
            <div class="slot" onclick="selectSlot(this)">🪵</div>
            <div class="slot" onclick="selectSlot(this)">🧱</div>
            <div class="slot" onclick="selectSlot(this)">🗡️</div>
            <div class="slot" onclick="selectSlot(this)">⛏️</div>
            <div class="slot" onclick="selectSlot(this)">🪓</div>
            <div class="slot" onclick="selectSlot(this)">🍎</div>
            <div class="slot" onclick="selectSlot(this)">🥩</div>
        </div>
    </div>
</div>

<script>
    // Dillər Siyahısı (AZ, TR, EN)
    const languages = [
        { name: "Azərbaycan", play: "Dünyanı Yarat / Oyna", langBtn: "Dil: Azərbaycan", full: "Tam Ekran (Full Screen)" },
        { name: "Türkçe", play: "Dünya Oluştur / Oyna", langBtn: "Dil: Türkçe", full: "Tam Ekran (Full Screen)" },
        { name: "English", play: "Create World / Play", langBtn: "Language: English", full: "Full Screen" }
    ];
    let currentLangIndex = 0;

    function changeLanguage() {
        currentLangIndex = (currentLangIndex + 1) % languages.length;
        const lang = languages[currentLangIndex];
        
        document.getElementById('btn-play').innerText = lang.play;
        document.getElementById('btn-lang').innerText = lang.langBtn;
        document.getElementById('btn-full').innerText = lang.full;
    }

    // Tam Ekran Rejimi
    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }

    // Hotbar Slot Seçimi
    function selectSlot(element) {
        document.querySelectorAll('.slot').forEach(s => s.classList.remove('active'));
        element.classList.add('active');
    }

    // 3D Dünya Generasiyası (Three.js)
    let scene, camera, renderer;

    function startGame() {
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('hud').style.display = 'flex';
        document.getElementById('crosshair').style.display = 'block';

        // 3D Səhnə
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Göy üzü rəngi

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('game-container').appendChild(renderer.domElement);

        // İşıqlandırma
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 10, 7.5);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        // Blok Materialları və Torpaq/Kublar Yaratmaq
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        
        // Yaşıl Bloklar (Çəmənlik)
        const grassMaterial = new THREE.MeshLamberMaterial ? new THREE.MeshLambertMaterial({ color: 0x559933 }) : new THREE.MeshBasicMaterial({ color: 0x559933 });

        // 10x10 Voksel Dünyası
        for (let x = -5; x < 5; x++) {
            for (let z = -5; z < 5; z++) {
                const cube = new THREE.Mesh(geometry, grassMaterial);
                cube.position.set(x, 0, z);
                scene.add(cube);
            }
        }

        camera.position.set(0, 2, 5);
        camera.lookAt(0, 0, 0);

        // Animasiya Dövrü
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
    }

    // Ekran Ölçüsü Dəyişəndə Qrafikanı Uyğunlaşdırmaq
    window.addEventListener('resize', () => {
        if (renderer && camera) {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    });
</script>

</body>
</html>
