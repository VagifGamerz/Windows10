<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Minecraft Bedrock v26.32</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 28px;
            font-weight: bold;
            pointer-events: none;
            z-index: 10;
            display: none;
        }

        /* HUD & Hotbar */
        #hud {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 20;
        }

        .bars {
            display: flex;
            justify-content: space-between;
            width: 320px;
            margin-bottom: 4px;
            font-size: 15px;
        }

        .hotbar {
            display: flex;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #3c3c3c;
            padding: 2px;
            gap: 3px;
        }

        .slot {
            width: 36px;
            height: 36px;
            background: #777;
            border: 2px solid #333;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            cursor: pointer;
        }

        .slot.active {
            border: 2px solid #fff;
            background: #aaa;
        }

        /* Düymələr (Mobil üçün) */
        .touch-controls {
            position: absolute;
            bottom: 15px;
            left: 15px;
            display: grid;
            grid-template-columns: repeat(3, 42px);
            grid-template-rows: repeat(3, 42px);
            gap: 4px;
            z-index: 30;
        }

        .t-btn {
            background: rgba(255, 255, 255, 0.35);
            border: 1px solid #fff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .action-btns {
            position: absolute;
            bottom: 15px;
            right: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 30;
        }

        .act-btn {
            width: 70px;
            height: 40px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #fff;
            color: #fff;
            font-size: 12px;
            border-radius: 5px;
            font-weight: bold;
        }

        /* Ənvantar Menyusu */
        #inventory-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            background: rgba(20, 20, 20, 0.95);
            border: 2px solid #fff;
            padding: 15px;
            display: none;
            flex-wrap: wrap;
            gap: 8px;
            z-index: 100;
            color: white;
            border-radius: 8px;
        }

        .inv-item {
            width: 42px;
            height: 42px;
            background: #444;
            border: 1px solid #888;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            cursor: pointer;
        }

        /* Başlanğıc Menyusu */
        #main-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #2b5c2b;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        .title { font-size: 40px; color: #fff; text-shadow: 2px 2px #000; }
        .version { color: #ffff55; margin-bottom: 20px; font-weight: bold; }
        .menu-btn {
            width: 240px; padding: 12px; margin: 6px;
            background: #555; border: 2px solid #000;
            color: white; font-weight: bold; cursor: pointer;
        }
    </style>
    <!-- Three.js mühərriki -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="game-container">
    <div id="crosshair">+</div>

    <!-- Əsas Menyu -->
    <div id="main-menu">
        <h1 class="title">MINECRAFT</h1>
        <div class="version">Bedrock Edition v26.32</div>
        <button class="menu-btn" onclick="startGame()">Dünyanı Yarat / Oyna</button>
    </div>

    <!-- HUD (Can, Yemək, Hotbar) -->
    <div id="hud">
        <div class="bars">
            <div>❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️</div>
            <div>🍗🍗🍗🍗🍗🍗🍗🍗🍗🍗</div>
        </div>
        <div class="hotbar">
            <div class="slot active" onclick="selectSlot(this, 'grass')">🌱</div>
            <div class="slot" onclick="selectSlot(this, 'dirt')">🟫</div>
            <div class="slot" onclick="selectSlot(this, 'stone')">🪨</div>
            <div class="slot" onclick="selectSlot(this, 'wood')">🪵</div>
            <div class="slot" onclick="selectSlot(this, 'leaves')">🍃</div>
        </div>
    </div>

    <!-- Mobil Düymələr -->
    <div class="touch-controls" id="touch-ui" style="display:none;">
        <div></div><button class="t-btn" id="btn-fwd">▲</button><div></div>
        <button class="t-btn" id="btn-left">◄</button><div></div><button class="t-btn" id="btn-right">►</button>
        <div></div><button class="t-btn" id="btn-back">▼</button><div></div>
    </div>

    <div class="action-btns" id="action-ui" style="display:none;">
        <button class="act-btn" onclick="toggleFly()">🪽 Uç/Yeri</button>
        <button class="act-btn" onclick="toggleInventory()">🎒 Ənvantar</button>
        <button class="act-btn" onclick="breakBlock()">⛏️ Qaz</button>
        <button class="act-btn" onclick="placeBlock()">🧱 Qoy</button>
    </div>

    <!-- Ənvantar -->
    <div id="inventory-modal">
        <h4 style="width:100%">Ənvantar (Bloklar)</h4>
        <div class="inv-item" onclick="setBlock('grass', '🌱')">🌱</div>
        <div class="inv-item" onclick="setBlock('dirt', '🟫')">🟫</div>
        <div class="inv-item" onclick="setBlock('stone', '🪨')">🪨</div>
        <div class="inv-item" onclick="setBlock('wood', '🪵')">🪵</div>
        <div class="inv-item" onclick="setBlock('leaves', '🍃')">🍃</div>
        <div class="inv-item" onclick="setBlock('brick', '🧱')">🧱</div>
        <button style="width:100%; margin-top:10px; padding:6px;" onclick="toggleInventory()">Bağla</button>
    </div>
</div>

<script>
    let scene, camera, renderer;
    let blocks = [];
    let activeBlockType = 'grass';
    let isFlying = false;

    let move = { fwd: false, back: false, left: false, right: false };

    // Şəffaf və parlaq materiallar (Qara ekran problemini aradan qaldırır)
    const materials = {
        grass: new THREE.MeshBasicMaterial({ color: 0x4d9e29 }),
        dirt: new THREE.MeshBasicMaterial({ color: 0x734823 }),
        stone: new THREE.MeshBasicMaterial({ color: 0x707070 }),
        wood: new THREE.MeshBasicMaterial({ color: 0x54381e }),
        leaves: new THREE.MeshBasicMaterial({ color: 0x226b22 }),
        brick: new THREE.MeshBasicMaterial({ color: 0x9c3127 })
    };

    function startGame() {
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('hud').style.display = 'flex';
        document.getElementById('crosshair').style.display = 'block';
        document.getElementById('touch-ui').style.display = 'grid';
        document.getElementById('action-ui').style.display = 'flex';

        // 3D Səhnə
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Açıq göy üzü

        camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('game-container').appendChild(renderer.domElement);

        // Dünyanı Qurmaq
        buildWorld();

        // Kamera mövqeyi (Açılan kimi torpağı və ağacları görürsən)
        camera.position.set(0, 2.5, 6);
        camera.lookAt(0, 1, 0);

        setupEvents();

        // Oyun Dövrü
        function animate() {
            requestAnimationFrame(animate);

            const speed = isFlying ? 0.15 : 0.07;
            if (move.fwd) camera.position.z -= speed;
            if (move.back) camera.position.z += speed;
            if (move.left) camera.position.x -= speed;
            if (move.right) camera.position.x += speed;

            renderer.render(scene, camera);
        }
        animate();
    }

    function buildWorld() {
        const geo = new THREE.BoxGeometry(1, 1, 1);

        // 16x16 Yaşıl Meydança və Torpaq
        for (let x = -8; x <= 8; x++) {
            for (let z = -8; z <= 8; z++) {
                const gBlock = new THREE.Mesh(geo, materials.grass);
                gBlock.position.set(x, 0, z);
                scene.add(gBlock);
                blocks.push(gBlock);

                const dBlock = new THREE.Mesh(geo, materials.dirt);
                dBlock.position.set(x, -1, z);
                scene.add(dBlock);
                blocks.push(dBlock);
            }
        }

        // Ağaclar
        addTree(2, 1, -2);
        addTree(-3, 1, -4);
    }

    function addTree(x, y, z) {
        const geo = new THREE.BoxGeometry(1, 1, 1);
        // Gövdə
        for(let i=0; i<3; i++) {
            const trunk = new THREE.Mesh(geo, materials.wood);
            trunk.position.set(x, y + i, z);
            scene.add(trunk);
            blocks.push(trunk);
        }
        // Yarpaqlar
        for(let lx=-1; lx<=1; lx++) {
            for(let lz=-1; lz<=1; lz++) {
                for(let ly=3; ly<=4; ly++) {
                    const leaf = new THREE.Mesh(geo, materials.leaves);
                    leaf.position.set(x + lx, y + ly, z + lz);
                    scene.add(leaf);
                    blocks.push(leaf);
                }
            }
        }
    }

    function setupEvents() {
        // Toxunma düymələri
        const bind = (id, key) => {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); move[key] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); move[key] = false; });
            btn.addEventListener('mousedown', () => move[key] = true);
            btn.addEventListener('mouseup', () => move[key] = false);
        };
        bind('btn-fwd', 'fwd');
        bind('btn-back', 'back');
        bind('btn-left', 'left');
        bind('btn-right', 'right');
    }

    function toggleFly() {
        isFlying = !isFlying;
        camera.position.y += isFlying ? 2 : -2;
    }

    function toggleInventory() {
        const inv = document.getElementById('inventory-modal');
        inv.style.display = inv.style.display === 'flex' ? 'none' : 'flex';
    }

    function selectSlot(el, type) {
        document.querySelectorAll('.slot').forEach(s => s.classList.remove('active'));
        el.classList.add('active');
        activeBlockType = type;
    }

    function setBlock(type, emoji) {
        activeBlockType = type;
        const activeSlot = document.querySelector('.slot.active');
        if(activeSlot) activeSlot.innerText = emoji;
        toggleInventory();
    }

    // Blok Qoymaq
    function placeBlock() {
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
        const hits = raycaster.intersectObjects(blocks);

        if (hits.length > 0) {
            const hit = hits[0];
            const geo = new THREE.BoxGeometry(1, 1, 1);
            const b = new THREE.Mesh(geo, materials[activeBlockType]);
            
            b.position.copy(hit.point).add(hit.face.normal);
            b.position.floor().addScalar(0.5);

            scene.add(b);
            blocks.push(b);
        }
    }

    // Blok Sındırmaq
    function breakBlock() {
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
        const hits = raycaster.intersectObjects(blocks);

        if (hits.length > 0) {
            const target = hits[0].object;
            scene.remove(target);
            blocks = blocks.filter(b => b !== target);
        }
    }
</script>

</body>
</html>
