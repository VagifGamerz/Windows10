<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Minecraft Bedrock v26.32 - Playable Engine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* UI overlays */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 26px;
            font-weight: bold;
            pointer-events: none;
            z-index: 10;
            display: none;
        }

        /* Hotbar & HUD */
        #hud {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 20;
        }

        .bars-container {
            display: flex;
            justify-content: space-between;
            width: 360px;
            margin-bottom: 5px;
            font-size: 16px;
        }

        .hotbar {
            display: flex;
            background: rgba(0, 0, 0, 0.65);
            border: 2px solid #3c3c3c;
            padding: 2px;
            gap: 2px;
        }

        .slot {
            width: 38px;
            height: 38px;
            background: #8b8b8b;
            border: 2px solid #373737;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            cursor: pointer;
        }

        .slot.active {
            border: 2px solid #ffffff;
            background: #b0b0b0;
        }

        /* Mobile Controls */
        .touch-controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: grid;
            grid-template-columns: repeat(3, 45px);
            grid-template-rows: repeat(3, 45px);
            gap: 5px;
            z-index: 30;
        }

        .t-btn {
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid #fff;
            color: white;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .action-btns {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 30;
        }

        .act-btn {
            width: 60px;
            height: 45px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #fff;
            color: #fff;
            font-size: 13px;
            border-radius: 5px;
        }

        /* Inventory Modal */
        #inventory-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 340px;
            background: rgba(30, 30, 30, 0.95);
            border: 3px solid #555;
            padding: 15px;
            display: none;
            flex-wrap: wrap;
            gap: 10px;
            z-index: 100;
            color: white;
        }

        .inv-item {
            width: 45px;
            height: 45px;
            background: #4a4a4a;
            border: 2px solid #222;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            cursor: pointer;
        }

        /* Main Menu */
        #main-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('https://images.unsplash.com/photo-1627856013091-fed6e4e30025?q=80&w=1200') center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        .title { font-size: 44px; color: #fff; text-shadow: 3px 3px #000; }
        .version { color: #ffff55; margin-bottom: 25px; }
        .menu-btn {
            width: 250px; padding: 12px; margin: 5px;
            background: #737373; border: 2px solid #000;
            color: white; font-weight: bold; cursor: pointer;
            box-shadow: inset -2px -2px #373737, inset 2px 2px #fff;
        }
    </style>
    <!-- Three.js (3D Render Engine) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="game-container">
    <div id="crosshair">+</div>

    <!-- Main Menu -->
    <div id="main-menu">
        <h1 class="title">MINECRAFT</h1>
        <div class="version">Bedrock Edition v26.32</div>
        <button class="menu-btn" id="btn-play" onclick="initGame()">Oyna / Dünyanı Yarat</button>
        <button class="menu-btn" onclick="changeLang()">Dil: AZ</button>
    </div>

    <!-- HUD -->
    <div id="hud">
        <div class="bars-container">
            <div id="hp-bar">❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️</div>
            <div id="food-bar">🍗🍗🍗🍗🍗🍗🍗🍗🍗🍗</div>
        </div>
        <div class="hotbar" id="hotbar">
            <div class="slot active" data-type="grass">🌱</div>
            <div class="slot" data-type="dirt">🟫</div>
            <div class="slot" data-type="stone">🪨</div>
            <div class="slot" data-type="wood">🪵</div>
            <div class="slot" data-type="leaves">🍃</div>
        </div>
    </div>

    <!-- Mobile Touch UI Controls -->
    <div class="touch-controls" id="touch-ui" style="display:none;">
        <div></div><button class="t-btn" id="btn-fwd">▲</button><div></div>
        <button class="t-btn" id="btn-left">◄</button><div></div><button class="t-btn" id="btn-right">►</button>
        <div></div><button class="t-btn" id="btn-back">▼</button><div></div>
    </div>

    <div class="action-btns" id="action-ui" style="display:none;">
        <button class="act-btn" onclick="toggleFly()">🪽 Uç/Yeri</button>
        <button class="act-btn" onclick="toggleInventory()">🎒 Ənvantar</button>
        <button class="act-btn" id="btn-break">⛏️ Qaz</button>
        <button class="act-btn" id="btn-place">🧱 Qoy</button>
    </div>

    <!-- Inventory Box -->
    <div id="inventory-modal">
        <h4 style="width:100%">Ənvantar (Bloklar)</h4>
        <div class="inv-item" onclick="selectInvBlock('grass', '🌱')">🌱</div>
        <div class="inv-item" onclick="selectInvBlock('dirt', '🟫')">🟫</div>
        <div class="inv-item" onclick="selectInvBlock('stone', '🪨')">🪨</div>
        <div class="inv-item" onclick="selectInvBlock('wood', '🪵')">🪵</div>
        <div class="inv-item" onclick="selectInvBlock('leaves', '🍃')">🍃</div>
        <div class="inv-item" onclick="selectInvBlock('brick', '🧱')">🧱</div>
        <button style="width:100%; margin-top:10px;" onclick="toggleInventory()">Bağla (E)</button>
    </div>
</div>

<script>
    let scene, camera, renderer;
    let blocks = [];
    let selectedBlockType = 'grass';
    let isFlying = false;

    // Player position logic
    let playerPos = { x: 0, y: 3, z: 8 };
    let moveState = { fwd: false, back: false, left: false, right: false };

    // Material Colors
    const blockMaterials = {
        grass: new THREE.MeshLambertMaterial({ color: 0x55aa33 }),
        dirt: new THREE.MeshLambertMaterial({ color: 0x8b5a2b }),
        stone: new THREE.MeshLambertMaterial({ color: 0x808080 }),
        wood: new THREE.MeshLambertMaterial({ color: 0x5c4033 }),
        leaves: new THREE.MeshLambertMaterial({ color: 0x2e8b57 }),
        brick: new THREE.MeshLambertMaterial({ color: 0xb22222 })
    };

    function initGame() {
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('hud').style.display = 'flex';
        document.getElementById('crosshair').style.display = 'block';
        document.getElementById('touch-ui').style.display = 'grid';
        document.getElementById('action-ui').style.display = 'flex';

        // Scene
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Göy üzü

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('game-container').appendChild(renderer.domElement);

        // Lights
        const sun = new THREE.DirectionalLight(0xffffff, 0.9);
        sun.position.set(20, 40, 20);
        scene.add(sun);
        scene.add(new THREE.AmbientLight(0x606060));

        // World Generation (Sonsuz Torpaq v3 Ağaclar)
        generateWorld();

        camera.position.set(playerPos.x, playerPos.y, playerPos.z);

        // Control Events
        setupControls();

        // Render Loop
        function animate() {
            requestAnimationFrame(animate);

            // Movement Logic
            const speed = isFlying ? 0.2 : 0.08;
            if (moveState.fwd) camera.position.z -= speed;
            if (moveState.back) camera.position.z += speed;
            if (moveState.left) camera.position.x -= speed;
            if (moveState.right) camera.position.x += speed;

            renderer.render(scene, camera);
        }
        animate();
    }

    function generateWorld() {
        const geo = new THREE.BoxGeometry(1, 1, 1);

        // Ground (20x20 Dirt & Grass)
        for (let x = -10; x <= 10; x++) {
            for (let z = -10; z <= 10; z++) {
                // Top layer - Grass
                const gBlock = new THREE.Mesh(geo, blockMaterials.grass);
                gBlock.position.set(x, 0, z);
                scene.add(gBlock);
                blocks.push(gBlock);

                // Underground - Dirt
                const dBlock = new THREE.Mesh(geo, blockMaterials.dirt);
                dBlock.position.set(x, -1, z);
                scene.add(dBlock);
                blocks.push(dBlock);
            }
        }

        // Add Trees (Ağaclar)
        createTree(3, 1, -3);
        createTree(-4, 1, -5);
    }

    function createTree(x, y, z) {
        const geo = new THREE.BoxGeometry(1, 1, 1);
        // Wood Trunk (Gövdə)
        for(let i=0; i<3; i++) {
            const trunk = new THREE.Mesh(geo, blockMaterials.wood);
            trunk.position.set(x, y + i, z);
            scene.add(trunk);
            blocks.push(trunk);
        }
        // Leaves (Yarpaqlar)
        for(let lx=-1; lx<=1; lx++) {
            for(let lz=-1; lz<=1; lz++) {
                for(let ly=3; ly<=4; ly++) {
                    const leaf = new THREE.Mesh(geo, blockMaterials.leaves);
                    leaf.position.set(x + lx, y + ly, z + lz);
                    scene.add(leaf);
                    blocks.push(leaf);
                }
            }
        }
    }

    // Controls setup
    function setupControls() {
        // Keyboard controls
        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W') moveState.fwd = true;
            if (e.key === 's' || e.key === 'S') moveState.back = true;
            if (e.key === 'a' || e.key === 'A') moveState.left = true;
            if (e.key === 'd' || e.key === 'D') moveState.right = true;
            if (e.key === 'e' || e.key === 'E') toggleInventory();
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'W') moveState.fwd = false;
            if (e.key === 's' || e.key === 'S') moveState.back = false;
            if (e.key === 'a' || e.key === 'A') moveState.left = false;
            if (e.key === 'd' || e.key === 'D') moveState.right = false;
        });

        // Touch button listeners
        const bindTouch = (id, prop) => {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); moveState[prop] = true; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); moveState[prop] = false; });
        };
        bindTouch('btn-fwd', 'fwd');
        bindTouch('btn-back', 'back');
        bindTouch('btn-left', 'left');
        bindTouch('btn-right', 'right');

        // Break / Place functionality
        document.getElementById('btn-break').onclick = breakBlock;
        document.getElementById('btn-place').onclick = placeBlock;
    }

    function toggleFly() {
        isFlying = !isFlying;
        if(isFlying) camera.position.y += 2;
        else camera.position.y = 3;
    }

    function toggleInventory() {
        const inv = document.getElementById('inventory-modal');
        inv.style.display = inv.style.display === 'flex' ? 'none' : 'flex';
    }

    function selectInvBlock(type, emoji) {
        selectedBlockType = type;
        const activeSlot = document.querySelector('.slot.active');
        if(activeSlot) {
            activeSlot.dataset.type = type;
            activeSlot.innerText = emoji;
        }
        toggleInventory();
    }

    // Raycasting for Block Placement/Break
    function placeBlock() {
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
        const intersects = raycaster.intersectObjects(blocks);

        if (intersects.length > 0) {
            const intersect = intersects[0];
            const geo = new THREE.BoxGeometry(1, 1, 1);
            const newBlock = new THREE.Mesh(geo, blockMaterials[selectedBlockType]);
            
            // Calculate adjacent position
            newBlock.position.copy(intersect.point).add(intersect.face.normal);
            newBlock.position.floor().addScalar(0.5);

            scene.add(newBlock);
            blocks.push(newBlock);
        }
    }

    function breakBlock() {
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
        const intersects = raycaster.intersectObjects(blocks);

        if (intersects.length > 0) {
            const target = intersects[0].object;
            scene.remove(target);
            blocks = blocks.filter(b => b !== target);
        }
    }

    function changeLang() {
        alert("Dil dəyişdirildi: Azərbaycan");
    }
</script>

</body>
</html>
